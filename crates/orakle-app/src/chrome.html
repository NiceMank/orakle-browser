<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orakle V2 Chrome</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface-hover: #1f242c;
    --border: rgba(255, 255, 255, 0.08);
    --text: #f0f6fc;
    --text-muted: #8b949e;
    --accent: #0969da;
    --accent-focus: rgba(9, 105, 218, 0.35);
    --shield-ok: #10b981;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", "Inter", "Segoe UI", sans-serif;
    font-size: 13px;
    height: 56px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    user-select: none;
    overflow: hidden;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: -0.01em;
    padding-right: 6px;
    white-space: nowrap;
  }
  .brand-mark {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    background: var(--accent);
    display: grid;
    place-items: center;
    color: #fff;
    font-weight: 700;
    font-size: 12px;
  }
  .omnibox-form {
    flex: 1;
    display: flex;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    height: 36px;
    padding: 0 10px;
    gap: 8px;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .omnibox-form:focus-within {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent-focus);
  }
  .omnibox-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 12.5px;
  }
  .actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  button {
    height: 34px;
    padding: 0 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 150ms ease, border-color 150ms ease;
    white-space: nowrap;
  }
  button:hover { background: var(--surface-hover); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary {
    background: var(--accent);
    border-color: transparent;
    color: #ffffff;
  }
  button.primary:hover { background: #085ec2; }
  .shield-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 30px;
    padding: 0 10px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 11.5px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
  }
  .shield-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--shield-ok);
  }
</style>
</head>
<body>
  <div class="brand" aria-label="Orakle Browser">
    <span class="brand-mark">O</span>
    <span>Orakle</span>
  </div>

  <form class="omnibox-form" id="omniboxForm">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b949e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <input class="omnibox-input" id="urlInput" type="text" value="https://doc.rust-lang.org/" aria-label="Barre d'adresse" />
    <button type="submit" class="primary">Aller</button>
  </form>

  <div class="actions">
    <button type="button" id="btnSplit" title="Basculer Split View 50/50">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <line x1="12" y1="3" x2="12" y2="21"></line>
      </svg>
      Split View
    </button>
    <button type="button" id="btnDiscard" title="Suspendre le panneau droit en SQLite">
      Suspendre Droit
    </button>
    <div class="shield-pill" id="shieldBadge" title="Proxy Loopback Rust actif">
      <span class="shield-dot"></span>
      <span id="shieldCount">Proxy 0 blocages</span>
    </div>
  </div>

  <script>
    function postCmd(cmd, payload) {
      if (window.ipc && typeof window.ipc.postMessage === "function") {
        window.ipc.postMessage(JSON.stringify({ cmd, payload }));
      }
    }
    document.getElementById("omniboxForm").addEventListener("submit", (e) => {
      e.preventDefault();
      postCmd("navigate", document.getElementById("urlInput").value.trim());
    });
    document.getElementById("btnSplit").addEventListener("click", () => postCmd("toggle_split", ""));
    document.getElementById("btnDiscard").addEventListener("click", () => postCmd("discard_right", ""));
    window.updateOrakleStats = (blocked, discarded) => {
      document.getElementById("shieldCount").textContent = "Proxy " + blocked + " blocages";
      document.getElementById("btnDiscard").textContent = discarded ? "Restaurer Droit" : "Suspendre Droit";
    };
  </script>
</body>
</html>
