[package]
name = "orakle-core"
version = "0.2.0"
edition = "2021"
authors = ["Orakle Engineering Team"]
description = "Noyau système indépendant pour Orakle Browser : persistance SQLite ACID, filtrage Adblock, sonde Pulse et proxy sécurisé."

[dependencies]
rusqlite = { version = "0.33", features = ["bundled"] }
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
httparse = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
