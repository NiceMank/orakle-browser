[package]
name = "orakle-app"
version = "0.2.0"
edition = "2021"
authors = ["Orakle Engineering Team"]
description = "Hôte applicatif natif Orakle Browser V2 (Tao + WRY Multi-WebView, Split View, Proxy HTTP/SOCKS5 Rust, WebKitWebExtension, Tab Discarding)."

[dependencies]
orakle-core = { path = "../orakle-core" }
tao = "0.37"
wry = "0.57"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0"
